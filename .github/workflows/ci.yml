# No integrations currently need building — everything in use speaks MCP
# natively and is catalogued in the core repo's registry as an external entry.
#
# When one does need code, add a build job here plus an image publish to ghcr,
# following the pattern in novak-konzol.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  noop:
    name: nothing to build
    runs-on: ubuntu-latest
    steps:
      - run: echo "No integrations require a build. See README.md."
